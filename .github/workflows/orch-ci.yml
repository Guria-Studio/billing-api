# Generated by `orch init` (Sprint G-1). Safe to edit — orch never
# overwrites this file once it exists.
#
# Runs on every PR so `orch`'s auto-PR / CI-polling / auto-merge loop
# (see config.yaml's `vcs:` and `github:` sections) has a check to watch.
name: orch-ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels the run it replaces (orch
# force-pushes retries); runs on the base branch always finish.
concurrency:
  group: orch-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run tests
        # GIF demo workaround for hectorcanaimero/orch#500: a scaffold task
        # has no tests yet, and pytest exits 5 when it collects none.
        run: pytest || [ $? -eq 5 ]
